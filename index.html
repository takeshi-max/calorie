<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🥗 AI カロリーチェッカー Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f2f2f7; margin: 0; padding: 20px; color: #1c1c1e; }
    .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #e5e5ea; }
    h1 { font-size: 22px; margin: 0 0 20px; text-align: center; color: #1c1c1e; }
    label { font-size: 13px; font-weight: bold; color: #8e8e93; margin-bottom: 6px; display: block; }
    
    input[type="text"], input[type="password"], input[type="date"], input[type="month"] { 
      width: 100%; padding: 12px; margin-bottom: 16px; border-radius: 12px; border: 1px solid #e5e5ea; box-sizing: border-box; font-size: 16px; background: #f9f9f9; outline: none; 
    }
    input:focus { border-color: #34c759; background: #fff; }
    
    .file-input-wrapper { margin-bottom: 16px; }
    
    button { width: 100%; padding: 16px; background: #34c759; color: white; border: none; border-radius: 14px; font-size: 17px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 0 #248a3d; }
    button:active { transform: translateY(4px); box-shadow: none; }
    button:disabled { background: #aeaeb2; box-shadow: none; cursor: not-allowed; }

    #preview { width: 100%; max-height: 280px; object-fit: cover; border-radius: 16px; display: none; margin-bottom: 16px; border: 1px solid #e5e5ea; }
    
    .result-box { background: #f2fbf0; border: 2px solid #34c759; border-radius: 16px; padding: 16px; margin-top: 16px; display: none; animation: fadeIn 0.5s ease; }
    .calorie-large { font-size: 36px; font-weight: 900; color: #34c759; text-align: center; margin: 10px 0; }
    .macros { display: flex; justify-content: space-around; background: white; padding: 12px; border-radius: 10px; font-size: 12px; }

    .chart-container { width: 100%; height: 250px; margin-top: 10px; }
    
    .log-list { list-style: none; padding: 0; margin-top: 10px; }
    .log-item { background: white; padding: 14px; border-radius: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e5e5ea; }
    .del-btn { background: #ff3b30; color: white; border: none; border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
    
    .status-msg { font-size: 11px; color: #8e8e93; text-align: center; margin-top: 8px; height: 1.2em; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div class="card">
    <h1>🥗 AI カロリーチェッカー</h1>
    
    <label>Google Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="AI StudioのAPIキーを入力" />

    <label>食べた日付（過去分もOK）</label>
    <input type="date" id="recordDate" />

    <label>食事の写真を選択</label>
    <input type="file" id="imageInput" accept="image/*" onchange="handleImageSelect(event)" />
    <img id="preview" alt="プレビュー" />

    <button id="analyzeBtn" onclick="startAnalysis()" disabled>写真を解析して保存する</button>
    <div id="statusMsg" class="status-msg"></div>

    <div id="resultBox" class="result-box">
      <div id="resDishName" style="font-weight:bold; text-align:center; font-size:18px;"></div>
      <div class="calorie-large"><span id="resCalories">0</span> <span style="font-size:16px;">kcal</span></div>
      <div class="macros">
        <span>💪 P: <b id="resP">0</b>g</span>
        <span>🥑 F: <b id="resF">0</b>g</span>
        <span>🍚 C: <b id="resC">0</b>g</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div style="font-weight:900; margin-bottom:12px; text-align:center; color:#8e8e93;">📊 月間摂取カロリー推移</div>
    <input type="month" id="monthPicker" onchange="updateUI()" />
    <div class="chart-container">
      <canvas id="monthlyChart"></canvas>
    </div>
  </div>

  <div class="card">
    <div style="font-weight:bold; margin-bottom:12px; display:flex; justify-content:space-between;">
      <span>📋 食事ログ</span>
      <span id="monthTotal" style="color:#34c759;">月間合計: 0 kcal</span>
    </div>
    <div id="logList" class="log-list"></div>
  </div>

<script>
  let base64Image = '';
  let imageMimeType = '';
  let calorieChart = null;
  let mealLogs = [];

  // 初期化
  window.onload = () => {
    const today = new Date();
    document.getElementById('recordDate').value = today.toISOString().split('T')[0];
    document.getElementById('monthPicker').value = today.toISOString().slice(0, 7);
    
    document.getElementById('apiKey').value = localStorage.getItem('calorie_key_v2026') || '';
    document.getElementById('apiKey').addEventListener('change', (e) => localStorage.setItem('calorie_key_v2026', e.target.value.trim()));
    
    // データの復元
    mealLogs = JSON.parse(localStorage.getItem('meal_logs_v2026')) || [];
    updateUI();
  };

  function handleImageSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const max = 800;
        let w = img.width, h = img.height;
        if (w > max) { h *= max / w; w = max; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
        imageMimeType = 'image/jpeg';
        document.getElementById('preview').src = canvas.toDataURL('image/jpeg');
        document.getElementById('preview').style.display = 'block';
        document.getElementById('analyzeBtn').disabled = false;
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // --- 【執念のモデル探査ロジック】 ---
  async function startAnalysis() {
    const apiKey = document.getElementById('apiKey').value.trim();
    if (!apiKey) return alert("APIキーを入力してください");
    
    const btn = document.getElementById('analyzeBtn');
    const status = document.getElementById('statusMsg');
    btn.disabled = true;
    btn.textContent = "AI解析中...";

    try {
      const mRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const mData = await mRes.json();
      const models = mData.models.filter(m => m.supportedGenerationMethods.includes("generateContent")).sort((a,b)=>b.name.localeCompare(a.name));
      
      const lastModel = localStorage.getItem('working_model_calorie') || models[0].name;
      const targetModels = [ {name: lastModel}, ...models.filter(m => m.name !== lastModel) ];

      const prompt = `画像内の食事を分析し、以下のJSON形式でのみ出力してください。
{"dishName":"料理名","calories":推定カロリー(数値),"protein":たんぱく質g(数値),"fat":脂質g(数値),"carbs":炭水化物g(数値)}`;

      let success = false;
      for (const m of targetModels) {
        status.textContent = `試行中: ${m.name.split('/').pop()}...`;
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/${m.name}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: imageMimeType, data: base64Image } }] }],
              generationConfig: { responseMimeType: "application/json" }
            })
          });
          const data = await res.json();
          if (res.ok) {
            const result = JSON.parse(data.candidates[0].content.parts[0].text.match(/\{.*\}/s)[0]);
            finalizeResult(result);
            localStorage.setItem('working_model_calorie', m.name);
            success = true; break;
          }
        } catch (e) { console.warn(m.name, e); }
      }
      if (!success) alert("現在AIが制限されています。10分ほど待ってください。");
    } catch (err) { alert("エラー: " + err.message); }
    finally { btn.disabled = false; btn.textContent = "写真を解析して保存する"; status.textContent = ""; }
  }

  function finalizeResult(res) {
    document.getElementById('resDishName').textContent = res.dishName;
    document.getElementById('resCalories').textContent = res.calories;
    document.getElementById('resP').textContent = res.protein;
    document.getElementById('resF').textContent = res.fat;
    document.getElementById('resC').textContent = res.carbs;
    document.getElementById('resultBox').style.display = 'block';

    const date = document.getElementById('recordDate').value;
    mealLogs.push({ id: Date.now(), date, ...res });
    mealLogs.sort((a,b) => new Date(b.date) - new Date(a.date));
    localStorage.setItem('meal_logs_v2026', JSON.stringify(mealLogs));
    
    updateUI();
  }

  function updateUI() {
    const month = document.getElementById('monthPicker').value;
    const list = document.getElementById('logList');
    list.innerHTML = '';
    
    const filtered = mealLogs.filter(l => l.date.startsWith(month));
    let monthSum = 0;

    if (filtered.length === 0) {
      list.innerHTML = '<div style="text-align:center; color:#8e8e93; font-size:13px;">記録がありません</div>';
    } else {
      filtered.forEach(log => {
        monthSum += Number(log.calories);
        const div = document.createElement('div');
        div.className = 'log-item';
        div.innerHTML = `
          <div><div style="font-weight:bold;">${log.dishName}</div><div style="font-size:11px; color:#8e8e93;">${log.date}</div></div>
          <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-weight:bold; color:#34c759;">${log.calories} kcal</span>
            <button class="del-btn" onclick="deleteLog(${log.id})">✕</button>
          </div>`;
        list.appendChild(div);
      });
    }
    document.getElementById('monthTotal').textContent = `月間合計: ${monthSum} kcal`;
    renderChart(month, filtered);
  }

  function deleteLog(id) {
    if (!confirm("削除しますか？")) return;
    mealLogs = mealLogs.filter(l => l.id !== id);
    localStorage.setItem('meal_logs_v2026', JSON.stringify(mealLogs));
    updateUI();
  }

  function renderChart(monthStr, logs) {
    const [y, m] = monthStr.split('-').map(Number);
    const days = new Date(y, m, 0).getDate();
    const dailyData = Array(days).fill(0);
    
    logs.forEach(l => {
      const d = parseInt(l.date.split('-')[2], 10);
      dailyData[d-1] += Number(l.calories);
    });

    const ctx = document.getElementById('monthlyChart').getContext('2d');
    const data = {
      labels: Array.from({length: days}, (_, i) => i + 1),
      datasets: [{ data: dailyData, backgroundColor: '#34c759', borderRadius: 5 }]
    };

    if (calorieChart) {
      calorieChart.data = data;
      calorieChart.update();
    } else {
      calorieChart = new Chart(ctx, {
        type: 'bar',
        data: data,
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
      });
    }
  }
</script>
</body>
</html>
