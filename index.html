<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🥗 AI カロリーチェッカー Pro (執念の完全版)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f2f2f7; margin: 0; padding: 20px; color: #1c1c1e; }
    .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #e5e5ea; }
    h1 { font-size: 22px; margin: 0 0 20px; text-align: center; }
    input, select, textarea { width: 100%; padding: 12px; margin-bottom: 16px; border-radius: 12px; border: 1px solid #e5e5ea; box-sizing: border-box; font-size: 16px; background: #f9f9f9; outline: none; }
    button { width: 100%; padding: 16px; background: #34c759; color: white; border: none; border-radius: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:active { opacity: 0.7; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .chart-container { width: 100%; height: 220px; }
    .log-item { background: white; padding: 14px; border-radius: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e5e5ea; }
    #preview { width: 100%; border-radius: 12px; margin-bottom: 15px; display: none; border: 1px solid #eee; }
    #statusInfo { font-size: 12px; color: #888; margin-top: -10px; margin-bottom: 10px; text-align: center; min-height: 1.5em; }
    .transfer-box { background: #fff; border: 2px dashed #34c759; padding: 15px; border-radius: 12px; }
    .btn-secondary { background: #007aff; margin-top: 10px; }
    .btn-outline { background: white; color: #34c759; border: 2px solid #34c759; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🥗 AI カロリーチェッカー Pro</h1>
    <input type="password" id="apiKey" placeholder="Gemini API Key" />
    <label style="font-size:12px; color:#888;">食べた日付</label>
    <input type="date" id="recordDate" />
    
    <img id="preview">
    
    <input type="file" id="imageInput" accept="image/*" onchange="handleImageSelect(event)" />
    <button id="analyzeBtn" onclick="startAnalysis()" disabled>解析して保存</button>
    <div id="statusInfo"></div>
    
    <div id="resultBox" style="display:none; margin-top:15px; text-align:center; background:#f2fbf0; padding:10px; border-radius:10px;">
        <div id="resDishName" style="font-weight:bold;"></div>
        <div style="font-size:24px; color:#34c759; font-weight:bold;"><span id="resCalories">0</span> kcal</div>
    </div>
  </div>

  <div class="card">
    <div style="font-weight:bold; margin-bottom:12px; text-align:center;">📊 月間推移</div>
    <input type="month" id="monthPicker" onchange="updateUI()" />
    <div class="chart-container"><canvas id="monthlyChart"></canvas></div>
  </div>

  <div class="card">
    <div style="font-weight:bold; display:flex; justify-content:space-between; margin-bottom:10px;">
      <span>📋 食事ログ</span>
      <span id="monthTotal" style="color:#34c759;">0 kcal</span>
    </div>
    <div id="logList"></div>
  </div>

  <!-- 🆘 データ管理（出力・復元） -->
  <div class="card transfer-box">
    <div style="font-weight:bold; font-size:14px; color:#34c759; margin-bottom:10px;">📲 データの出力・強力復元</div>
    <textarea id="transferArea" rows="3" placeholder="ここにデータを貼り付けて復元、または出力を押すとコピーされます"></textarea>
    <button onclick="exportData()" class="btn-outline">現在のデータを出力（コピー）</button>
    <button onclick="importData()" class="btn-secondary">データを合体復元する</button>
  </div>

<script>
  let mealLogs = [];
  let calorieChart = null;
  let base64Image = '';

  window.onload = () => {
    // 今日をセット（タイムゾーン考慮）
    const now = new Date();
    const today = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    document.getElementById('recordDate').value = today;
    document.getElementById('monthPicker').value = today.slice(0, 7);
    
    // 保存データの読み込み
    document.getElementById('apiKey').value = localStorage.getItem('calorie_key_v2026') || '';
    mealLogs = JSON.parse(localStorage.getItem('meal_logs_v2026')) || [];
    updateUI();
  };

  function handleImageSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const max = 800; 
        let w = img.width, h = img.height;
        if (w > h) { if (w > max) { h *= max / w; w = max; } } else { if (h > max) { w *= max / h; h = max; } }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
        const previewEl = document.getElementById('preview');
        previewEl.src = canvas.toDataURL('image/jpeg');
        previewEl.style.display = 'block';
        document.getElementById('analyzeBtn').disabled = false;
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function startAnalysis() {
    const apiKey = document.getElementById('apiKey').value.trim();
    if (!apiKey) return alert("APIキーを入力してください");
    localStorage.setItem('calorie_key_v2026', apiKey);

    const btn = document.getElementById('analyzeBtn');
    const status = document.getElementById('statusInfo');
    btn.disabled = true;

    try {
      status.innerText = "モデルを確認中...";
      const mRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
      const mData = await mRes.json();
      
      let models = mData.models
        .filter(m => m.supportedGenerationMethods.includes("generateContent"))
        .sort((a, b) => b.name.localeCompare(a.name, undefined, { numeric: true }));

      const prompt = `食事分析。JSON形式{"dishName":"名前","calories":数値,"protein":数値,"fat":数値,"carbs":数値}`;
      let success = false;

      // 執念のリトライループ
      for (let model of models) {
        status.innerText = `試行中: ${model.name.split('/').pop()}...`;
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/${model.name}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: base64Image } }] }],
              generationConfig: { responseMimeType: "application/json" }
            })
          });

          const data = await res.json();
          if (res.ok && data.candidates) {
            const rawText = data.candidates[0].content.parts[0].text;
            const result = JSON.parse(rawText.match(/\{.*\}/s)[0]);
            
            document.getElementById('resDishName').textContent = result.dishName;
            document.getElementById('resCalories').textContent = result.calories;
            document.getElementById('resultBox').style.display = 'block';

            mealLogs.push({ id: Date.now(), date: document.getElementById('recordDate').value, ...result });
            mealLogs.sort((a,b) => new Date(b.date) - new Date(a.date));
            localStorage.setItem('meal_logs_v2026', JSON.stringify(mealLogs));
            updateUI();
            
            success = true;
            status.innerText = "解析成功！";
            break;
          }
        } catch (e) { console.warn(model.name + " 失敗。次を試します。"); }
      }
      if (!success) throw new Error("全てのモデルが制限中または利用不可です。");

    } catch (err) { alert("失敗: " + err.message); status.innerText = "エラー"; }
    finally { btn.disabled = false; }
  }

  function exportData() {
    const dataStr = JSON.stringify(mealLogs);
    const area = document.getElementById('transferArea');
    area.value = dataStr;
    area.select();
    document.execCommand('copy');
    alert("全データをコピーしました。メモ帳などに保存してください。");
  }

  function importData() {
    let input = document.getElementById('transferArea').value.trim();
    if (!input) return alert("データを貼り付けてください");
    try {
      input = input.replace(/^"/, '').replace(/"$/, '').replace(/\\"/g, '"');
      const start = input.indexOf('[');
      const end = input.lastIndexOf(']');
      if (start === -1 || end === -1) throw new Error("無効な形式");
      const imported = JSON.parse(input.substring(start, end + 1));
      
      if (Array.isArray(imported)) {
        if (confirm(`${imported.length}件のデータを復元（合体）しますか？`)) {
          imported.forEach(old => {
            if (!mealLogs.some(cur => (cur.id === old.id) || (cur.date === old.date && cur.dishName === old.dishName))) {
              mealLogs.push(old);
            }
          });
          mealLogs.sort((a, b) => new Date(b.date) - new Date(a.date));
          localStorage.setItem('meal_logs_v2026', JSON.stringify(mealLogs));
          updateUI();
          alert("復元完了！");
          document.getElementById('transferArea').value = "";
        }
      }
    } catch (e) { alert("復元失敗: 形式が正しくありません"); }
  }

  function updateUI() {
    const month = document.getElementById('monthPicker').value;
    const list = document.getElementById('logList');
    list.innerHTML = '';
    const filtered = mealLogs.filter(l => l.date && l.date.startsWith(month));
    let monthSum = 0;
    filtered.forEach(log => {
      monthSum += Number(log.calories);
      const div = document.createElement('div');
      div.className = 'log-item';
      div.innerHTML = `<div><b>${log.dishName}</b><br><small>${log.date}</small></div>
                       <div style="display:flex; align-items:center; gap:10px;">
                         <b>${log.calories} kcal</b>
                         <button onclick="deleteLog(${log.id})" style="background:none;border:none;color:#ccc;font-size:20px;">✕</button>
                       </div>`;
      list.appendChild(div);
    });
    document.getElementById('monthTotal').textContent = `${monthSum} kcal`;
    renderChart(month, filtered);
  }

  function deleteLog(id) {
    if (confirm("削除しますか？")) { 
      mealLogs = mealLogs.filter(l => l.id !== id); 
      localStorage.setItem('meal_logs_v2026', JSON.stringify(mealLogs)); 
      updateUI(); 
    }
  }

  function renderChart(monthStr, logs) {
    const [y, m] = monthStr.split('-').map(Number);
    const days = new Date(y, m, 0).getDate();
    const dailyData = Array(days).fill(0);
    logs.forEach(l => {
      const d = parseInt(l.date.split('-')[2], 10);
      dailyData[d-1] += Number(l.calories);
    });
    const ctx = document.getElementById('monthlyChart').getContext('2d');
    const data = {
      labels: Array.from({length: days}, (_, i) => i + 1),
      datasets: [{ label: 'kcal', data: dailyData, backgroundColor: '#34c759', borderRadius: 5 }]
    };
    if (calorieChart) { calorieChart.data = data; calorieChart.update(); }
    else { calorieChart = new Chart(ctx, { type: 'bar', data: data, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } }); }
  }
</script>
</body>
</html>
