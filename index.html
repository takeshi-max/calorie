<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🥗 AI カロリー・栄養士 Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f2f2f7; margin: 0; padding: 20px; color: #1c1c1e; }
    .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #e5e5ea; }
    h1 { font-size: 22px; margin: 0 0 20px; text-align: center; }
    input, select, textarea { width: 100%; padding: 12px; margin-bottom: 16px; border-radius: 12px; border: 1px solid #e5e5ea; box-sizing: border-box; font-size: 16px; background: #f9f9f9; outline: none; }
    button { width: 100%; padding: 16px; background: #34c759; color: white; border: none; border-radius: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:disabled { background: #ccc; }
    .chart-container { width: 100%; height: 220px; }
    .pfc-badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; margin-right: 4px; font-weight: bold; color: white; }
    .p-bg { background: #007aff; } 
    .f-bg { background: #ffcc00; color: #000; } 
    .c-bg { background: #ff9500; } 
    .log-item { background: white; padding: 14px; border-radius: 14px; margin-bottom: 10px; border: 1px solid #e5e5ea; }
    .log-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    #preview { width: 100%; border-radius: 12px; margin-bottom: 15px; display: none; }
    #statusInfo { font-size: 12px; color: #888; text-align: center; margin-bottom: 10px; min-height: 1.5em; }
    .report-box { background: #f8f9ff; border: 1px solid #d1d9ff; padding: 15px; border-radius: 14px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🥗 AI カロリー・栄養士 Pro</h1>
    <input type="password" id="apiKey" placeholder="Gemini API Key" />
    <input type="date" id="recordDate" />
    
    <img id="preview">
    <input type="file" id="imageInput" accept="image/*" onchange="handleImageSelect(event)" />
    <textarea id="textInput" rows="2" placeholder="撮り忘れ：例：鮭定食と納豆" oninput="toggleButton()"></textarea>

    <button id="analyzeBtn" onclick="startAnalysis()" disabled>解析して保存</button>
    <div id="statusInfo"></div>
    
    <div id="resultBox" style="display:none; margin-top:15px; text-align:center; background:#f2fbf0; padding:15px; border-radius:10px;">
        <div id="resDishName" style="font-weight:bold; font-size:18px;"></div>
        <div style="font-size:24px; color:#34c759; font-weight:bold; margin: 5px 0;"><span id="resCalories">0</span> kcal</div>
        <div id="resPFC"></div>
    </div>
  </div>

  <div class="card">
    <div style="font-weight:bold; margin-bottom:12px; text-align:center;">🏆 週刊AIアドバイス</div>
    <button onclick="generateWeeklyReport()" id="reportBtn" style="background:#5856d6; margin-bottom:10px;">直近7日間の栄養を分析</button>
    <div id="weeklyReportArea" class="report-box"></div>
  </div>

  <div class="card">
    <div style="font-weight:bold; margin-bottom:12px; text-align:center;">📊 月間推移</div>
    <input type="month" id="monthPicker" onchange="updateUI()" />
    <div class="chart-container"><canvas id="monthlyChart"></canvas></div>
  </div>

  <div class="card">
    <div style="font-weight:bold; display:flex; justify-content:space-between; margin-bottom:10px;">
      <span>📋 食事ログ（最新順）</span>
      <span id="monthTotal" style="color:#34c759; font-weight:bold;">0 kcal</span>
    </div>
    <div id="logList"></div>
  </div>

<script>
  let mealLogs = [];
  let calorieChart = null;
  let base64Image = '';

  window.onload = () => {
    const now = new Date();
    const today = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    document.getElementById('recordDate').value = today;
    document.getElementById('monthPicker').value = today.slice(0, 7);
    document.getElementById('apiKey').value = localStorage.getItem('calorie_key_v2026') || '';
    mealLogs = JSON.parse(localStorage.getItem('meal_logs_v2026')) || [];
    updateUI();
  };

  // --- 修正の要：並び替えロジック ---
  function sortLogs() {
    mealLogs.sort((a, b) => {
      // 1. まずは日付で比較
      if (b.date !== a.date) {
        return new Date(b.date) - new Date(a.date);
      }
      // 2. 同じ日付なら、ID（登録時のタイムスタンプ）の大きい方を上にする
      return b.id - a.id;
    });
  }

  function toggleButton() {
    const hasImage = base64Image !== '';
    const hasText = document.getElementById('textInput').value.trim() !== '';
    document.getElementById('analyzeBtn').disabled = !(hasImage || hasText);
  }

  function handleImageSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const max = 800; 
        let w = img.width, h = img.height;
        if (w > h) { if (w > max) { h *= max / w; w = max; } } else { if (h > max) { w *= max / h; h = max; } }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
        document.getElementById('preview').src = canvas.toDataURL('image/jpeg');
        document.getElementById('preview').style.display = 'block';
        toggleButton();
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function callGemini(contents) {
    const apiKey = document.getElementById('apiKey').value.trim();
    const mRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
    const mData = await mRes.json();
    let models = mData.models.filter(m => m.supportedGenerationMethods.includes("generateContent")).sort((a,b)=>b.name.localeCompare(a.name, undefined, {numeric:true}));
    
    for (let model of models) {
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/${model.name}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents, generationConfig: { responseMimeType: "application/json" } })
        });
        const data = await res.json();
        if (res.ok) return JSON.parse(data.candidates[0].content.parts[0].text.match(/\{.*\}/s)[0]);
      } catch (e) { console.warn(model.name + " skip"); }
    }
    throw new Error("APIエラー");
  }

  async function startAnalysis() {
    const btn = document.getElementById('analyzeBtn');
    const status = document.getElementById('statusInfo');
    const textInput = document.getElementById('textInput').value.trim();
    btn.disabled = true;
    status.innerText = "分析中...";

    try {
      let prompt = `食事分析JSON: {"dishName":"名","calories":数,"protein":数,"fat":数,"carbs":数}`;
      let contents = [{ parts: [{ text: prompt }] }];
      if (base64Image) {
        contents[0].parts.push({ inline_data: { mime_type: "image/jpeg", data: base64Image } });
      } else {
        contents[0].parts[0].text += `。内容: 「${textInput}」`;
      }

      const result = await callGemini(contents);
      
      // 結果表示
      document.getElementById('resDishName').textContent = result.dishName;
      document.getElementById('resCalories').textContent = result.calories;
      document.getElementById('resPFC').innerHTML = `
        <span class="pfc-badge p-bg">P: ${result.protein}g</span>
        <span class="pfc-badge f-bg">F: ${result.fat}g</span>
        <span class="pfc-badge c-bg">C: ${result.carbs}g</span>`;
      document.getElementById('resultBox').style.display = 'block';

      // ログに追加
      mealLogs.push({ id: Date.now(), date: document.getElementById('recordDate').value, ...result });
      
      // 並び替えて保存
      sortLogs(); 
      localStorage.setItem('meal_logs_v2026', JSON.stringify(mealLogs));
      
      // フォームリセット
      document.getElementById('textInput').value = '';
      document.getElementById('preview').style.display = 'none';
      base64Image = '';
      updateUI();
      status.innerText = "最上部に追加しました！";
    } catch (err) { alert(err.message); status.innerText = "失敗"; }
    finally { btn.disabled = false; toggleButton(); }
  }

  async function generateWeeklyReport() {
    const reportBtn = document.getElementById('reportBtn');
    const reportArea = document.getElementById('weeklyReportArea');
    const apiKey = document.getElementById('apiKey').value.trim();
    if (!apiKey) return alert("APIキーを入力してください");

    const sevenDaysAgo = new Date();
    sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
    const targetLogs = mealLogs.filter(l => new Date(l.date) >= sevenDaysAgo);
    if (targetLogs.length === 0) return alert("分析データがありません");

    reportBtn.disabled = true;
    reportArea.style.display = "block";
    reportArea.innerText = "分析中...";

    try {
      const summary = targetLogs.map(l => `${l.date}: ${l.dishName}(${l.calories}kcal, P:${l.protein}, F:${l.fat}, C:${l.carbs})`).join('\n');
      const result = await callGemini([{ parts: [{ text: `以下の食事ログを分析し、不足栄養素と改善アドバイスを200文字で。JSON {"advice":"文"}\nログ:\n${summary}` }] }]);
      reportArea.innerText = "【AI栄養診断】\n\n" + result.advice;
    } catch (err) { reportArea.innerText = "失敗しました。"; }
    finally { reportBtn.disabled = false; }
  }

  function updateUI() {
    const month = document.getElementById('monthPicker').value;
    const list = document.getElementById('logList');
    list.innerHTML = '';
    
    // 表示前に念のためもう一度ソート
    sortLogs();

    const filtered = mealLogs.filter(l => l.date && l.date.startsWith(month));
    let monthSum = 0;
    filtered.forEach(log => {
      monthSum += Number(log.calories);
      const div = document.createElement('div');
      div.className = 'log-item';
      div.innerHTML = `
        <div class="log-header">
          <div><b>${log.dishName}</b><br><small>${log.date}</small></div>
          <div style="text-align:right">
            <b style="color:#34c759">${log.calories} kcal</b><br>
            <button onclick="deleteLog(${log.id})" style="background:none;border:none;color:#ccc;font-size:18px;">✕</button>
          </div>
        </div>
        <div>
          <span class="pfc-badge p-bg">P: ${log.protein || 0}g</span>
          <span class="pfc-badge f-bg">F: ${log.fat || 0}g</span>
          <span class="pfc-badge c-bg">C: ${log.carbs || 0}g</span>
        </div>`;
      list.appendChild(div);
    });
    document.getElementById('monthTotal').textContent = `${monthSum} kcal`;
    renderChart(month, filtered);
  }

  function deleteLog(id) {
    if (confirm("削除?")) { mealLogs = mealLogs.filter(l => l.id !== id); localStorage.setItem('meal_logs_v2026', JSON.stringify(mealLogs)); updateUI(); }
  }

  function renderChart(monthStr, logs) {
    const [y, m] = monthStr.split('-').map(Number);
    const days = new Date(y, m, 0).getDate();
    const dailyData = Array(days).fill(0);
    logs.forEach(l => {
      const d = parseInt(l.date.split('-')[2], 10);
      dailyData[d-1] += Number(l.calories);
    });
    const ctx = document.getElementById('monthlyChart').getContext('2d');
    const data = {
      labels: Array.from({length: days}, (_, i) => i + 1),
      datasets: [{ label: 'kcal', data: dailyData, backgroundColor: '#34c759', borderRadius: 5 }]
    };
    if (calorieChart) { calorieChart.data = data; calorieChart.update(); }
    else { calorieChart = new Chart(ctx, { type: 'bar', data: data, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } }); }
  }
</script>
</body>
</html>
